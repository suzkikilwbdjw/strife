name: strife
description: "The most wonderful mobile video conferencing application"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  firebase_auth: ^6.1.3
  provider: ^6.1.5+1
  cloud_firestore: ^6.1.1
  random_string: ^2.3.1
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  permission_handler: ^12.0.1
  http: ^1.6.0
  livekit_client: ^2.6.1
  livekit_components: ^1.3.0
  fluttertoast: ^9.0.0
  google_fonts: ^6.3.3
  google_sign_in: ^7.2.0
  google_sign_in_android: ^7.2.7
  intl_phone_field: ^3.2.0
  intl: any
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  flutter_web_auth_2: ^5.0.1
  flutter_appauth: ^12.0.0
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  firebase_messaging: ^16.2.0
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^21.0.0
  flutter_native_splash: ^2.4.7
  firebase_database: ^12.3.0
  path_provider: ^2.1.5
  bot_toast: ^4.1.3
  collection: ^1.19.1
  animations: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_full_icon.png"
  adaptive_icon_background: "assets/images/app_background_icon.png"
  adaptive_icon_foreground: "assets/images/app_foreground_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#920092"       
  image: "assets/images/app_spalsh_logo.png"       

  android_12:                    
    image: "assets/images/app_spalsh_logo.png"       
    icon_background_color: "#920092"

  ios: true                      
  android: true                  